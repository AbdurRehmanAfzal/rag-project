name: Deploy to VPS

# Runs on every push to main: SSHes into the Hostinger VPS and re-runs
# deploy/deploy.sh there (git pull, docker compose up -d --build). The
# container joins the existing Traefik/n8n_default setup already on that
# VPS. Requires the one-time setup in deploy/DEPLOY.md to be done first.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_REPO_PATH }}
            bash deploy/deploy.sh
