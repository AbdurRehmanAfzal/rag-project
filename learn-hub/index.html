<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Learning Hub</title>
<meta name="description" content="An interactive hub documenting everything learned about Machine Learning and AI Engineering.">
<style>
  :root {
    --accent: #635BFF;
    --accent-dark: #4F46E5;
    --accent-light: #EEEDFF;
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --code-bg: #1E1B33;
    --text: #14162B;
    --text-muted: #6B7280;
    --border: #E6E8EC;
    --shadow: 0 4px 20px rgba(20, 20, 43, 0.08);
    --shadow-lg: 0 12px 44px rgba(20, 20, 43, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(247, 248, 250, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .topbar-title {
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topbar-title span {
    color: var(--accent);
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    transition: all 0.15s ease;
  }

  .back-link:hover {
    color: var(--accent-dark);
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
  }

  .back-link svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ---------- Hero / header ---------- */
  .hub-header {
    text-align: center;
    padding: 64px 20px 40px;
  }

  .hub-header h1 {
    font-size: clamp(32px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hub-header p {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ---------- Category sections ---------- */
  .category-section {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  .category-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .category-title::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .topic-card {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    font-family: inherit;
    color: inherit;
  }

  .topic-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent-light);
  }

  .topic-card h3 {
    margin: 0 0 8px;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topic-card p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 16, 35, 0.5);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .topic-modal {
    width: min(680px, 100%);
    max-height: min(760px, 90vh);
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(14px) scale(0.97);
    transition: transform 0.2s ease;
  }

  .modal-overlay.open .topic-modal {
    transform: translateY(0) scale(1);
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 24px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h2 {
    margin: 0 0 6px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .modal-header p {
    margin: 0;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .close-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--bg);
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .close-btn:hover { background: var(--accent-light); color: var(--accent-dark); }
  .close-btn svg { width: 16px; height: 16px; }

  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .modal-body::-webkit-scrollbar { width: 6px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .modal-section { margin-bottom: 26px; }
  .modal-section:last-child { margin-bottom: 0; }

  .modal-section h4 {
    margin: 0 0 10px;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-dark);
  }

  .modal-section p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
  }

  .modal-section ul {
    margin: 0;
    padding-left: 20px;
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
  }

  .modal-section li { margin-bottom: 6px; }
  .modal-section li:last-child { margin-bottom: 0; }

  pre.code-block {
    margin: 0;
    background: var(--code-bg);
    color: #E5E4F5;
    border-radius: 12px;
    padding: 16px 18px;
    overflow-x: auto;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .hl-keyword { color: #9D8CFF; font-weight: 600; }
  .hl-string { color: #7FE8B8; }
  .hl-comment { color: #7A7896; font-style: italic; }
  .hl-number { color: #FFB86C; }

  .qa-item {
    margin-bottom: 16px;
  }

  .qa-item:last-child { margin-bottom: 0; }

  .qa-item .qa-q {
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .qa-item .qa-a {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    padding-left: 14px;
    border-left: 2px solid var(--accent-light);
  }

  .ask-ai-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .ask-ai-btn:hover { background: var(--accent-dark); }
  .ask-ai-btn:active { transform: scale(0.97); }
  .ask-ai-btn svg { width: 16px; height: 16px; }

  @media (max-width: 640px) {
    .topbar { padding: 12px 16px; }
    .hub-header { padding: 48px 16px 32px; }
    .category-section { padding: 16px 16px 36px; }
    .topic-modal { width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-title">AI Engineering <span>Learning Hub</span></div>
    <a class="back-link" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Portfolio
    </a>
  </header>

  <main>
    <section class="hub-header">
      <h1>AI Engineering Learning Hub</h1>
      <p>Everything I've learned about Machine Learning and AI Engineering — documented, one topic at a time.</p>
    </section>

    <div id="categoriesContainer"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="topic-modal">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle"></h2>
          <p id="modalSummary"></p>
        </div>
        <button type="button" class="close-btn" id="closeModalBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

<script>
  const categoriesContainer = document.getElementById('categoriesContainer');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalSummary = document.getElementById('modalSummary');
  const modalBody = document.getElementById('modalBody');
  const closeModalBtn = document.getElementById('closeModalBtn');

  // The portfolio chat (frontend/src/App.tsx) reads a "q" URL query
  // parameter on load and auto-sends it as the first chat message —
  // see the useEffect near the top of the App component.
  const CHATBOT_URL = 'https://abdurrehmanafzal.cloud/';
  const CHATBOT_QUERY_PARAM = 'q';

  let topicsById = {};

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function highlightCode(code) {
    const escaped = escapeHtml(code);
    const pattern = /(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(import|from|def|class|return|if|elif|else|for|while|in|as|not|and|or|is|True|False|None|lambda|with|try|except|yield)\b|\b(\d+\.?\d*)\b/gm;
    return escaped.replace(pattern, (match, comment, string, keyword, number) => {
      if (comment) return `<span class="hl-comment">${comment}</span>`;
      if (string) return `<span class="hl-string">${string}</span>`;
      if (keyword) return `<span class="hl-keyword">${keyword}</span>`;
      if (number) return `<span class="hl-number">${number}</span>`;
      return match;
    });
  }

  function renderCategories(categories) {
    categoriesContainer.innerHTML = '';

    categories.forEach((category) => {
      const section = document.createElement('section');
      section.className = 'category-section';

      const title = document.createElement('h2');
      title.className = 'category-title';
      title.textContent = category.name;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'card-grid';

      category.topics.forEach((topic) => {
        topicsById[topic.id] = topic;

        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'topic-card';
        card.innerHTML = `<h3>${escapeHtml(topic.title)}</h3><p>${escapeHtml(topic.summary)}</p>`;
        card.addEventListener('click', () => openTopic(topic.id));
        grid.appendChild(card);
      });

      section.appendChild(grid);
      categoriesContainer.appendChild(section);
    });
  }

  function openTopic(topicId) {
    const topic = topicsById[topicId];
    if (!topic) return;

    modalTitle.textContent = topic.title;
    modalSummary.textContent = topic.summary;

    const howItems = topic.how.map(item => `<li>${escapeHtml(item)}</li>`).join('');
    const useCaseItems = topic.useCases.map(item => `<li>${escapeHtml(item)}</li>`).join('');
    const qaItems = topic.qa.map(pair => `
      <div class="qa-item">
        <div class="qa-q">${escapeHtml(pair.q)}</div>
        <div class="qa-a">${escapeHtml(pair.a)}</div>
      </div>`).join('');

    const askAiUrl = `${CHATBOT_URL}?${CHATBOT_QUERY_PARAM}=${encodeURIComponent('Explain ' + topic.title)}`;

    modalBody.innerHTML = `
      <div class="modal-section">
        <h4>What Is It</h4>
        <p>${escapeHtml(topic.whatIs)}</p>
      </div>
      <div class="modal-section">
        <h4>Why It's Needed</h4>
        <p>${escapeHtml(topic.why)}</p>
      </div>
      <div class="modal-section">
        <h4>How It Works</h4>
        <ul>${howItems}</ul>
      </div>
      <div class="modal-section">
        <h4>Code Example</h4>
        <pre class="code-block"><code>${highlightCode(topic.code)}</code></pre>
      </div>
      <div class="modal-section">
        <h4>Use Cases</h4>
        <ul>${useCaseItems}</ul>
      </div>
      <div class="modal-section">
        <h4>Interview Q&amp;A</h4>
        ${qaItems}
      </div>
      <div class="modal-section">
        <a class="ask-ai-btn" href="${askAiUrl}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Ask the AI Assistant
        </a>
      </div>
    `;

    modalOverlay.classList.add('open');
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
  }

  closeModalBtn.addEventListener('click', closeModal);

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
  });

  fetch('topics.json')
    .then((res) => res.json())
    .then((data) => renderCategories(data.categories))
    .catch(() => {
      categoriesContainer.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">Failed to load topics.</p>';
    });
</script>
</body>
</html>
