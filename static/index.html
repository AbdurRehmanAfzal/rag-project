<!DOCTYPE html>
<html>
<head>
    <title>RAG Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #answer {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Abdur Rehman - RAG Assistant</h1>
    <input type="text" id="questionInput" placeholder="Apna sawal poochein...">
    <button onclick="askQuestion()">Poochein</button>

    <div id="answer"></div>

    <script>
        async function askQuestion() {
            const question = document.getElementById("questionInput").value;
            document.getElementById("answer").innerText = "Soch raha hun...";

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();
            document.getElementById("answer").innerText = data.answer;
        }
    </script>
</body>
</html>
