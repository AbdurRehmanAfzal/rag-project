<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdur Rehman Afzal — AI Engineer &amp; Full-Stack Developer</title>
<style>
  :root {
    --accent: #635BFF;
    --accent-dark: #4F46E5;
    --accent-light: #EEEDFF;
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --text: #14162B;
    --text-muted: #6B7280;
    --border: #E6E8EC;
    --shadow: 0 4px 20px rgba(20, 20, 43, 0.08);
    --shadow-lg: 0 12px 44px rgba(20, 20, 43, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  button { font-family: inherit; }

  .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ---------- Background photo layer ---------- */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--bg);
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(30px) grayscale(15%);
    opacity: 0.16;
    transform: scale(1.15);
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,0.55), rgba(247,248,250,0.92) 70%),
      linear-gradient(180deg, rgba(247,248,250,0.85) 0%, rgba(247,248,250,0.97) 100%);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px;
  }

  .resume-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .resume-pill:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
    color: var(--accent-dark);
  }

  .top-icons {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .icon-btn:hover {
    color: var(--accent);
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
  }

  /* ---------- Left social rail ---------- */
  .social-rail {
    position: fixed;
    left: 26px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .social-rail::after {
    content: "";
    width: 1px;
    height: 60px;
    background: var(--border);
    margin-top: 4px;
  }

  .social-icon {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-muted);
    box-shadow: var(--shadow);
    text-decoration: none;
    transition: all 0.15s ease;
  }

  .social-icon:hover {
    color: var(--accent);
    border-color: var(--accent-light);
    transform: translateY(-2px) scale(1.05);
    box-shadow: var(--shadow-lg);
  }

  .social-icon svg { width: 17px; height: 17px; fill: currentColor; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 140px 20px 200px;
  }

  .hero-eyebrow {
    font-style: italic;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 14px;
    letter-spacing: 0.01em;
  }

  .hero-title {
    font-size: clamp(48px, 9vw, 78px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: 0;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero-subtitle {
    font-size: clamp(17px, 2.4vw, 22px);
    font-weight: 500;
    color: var(--text-muted);
    margin: 12px 0 0;
  }

  .hero-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #14162B;
    box-shadow: var(--shadow-lg);
    margin-top: 32px;
    background: var(--accent-light);
  }

  /* ---------- Chat trigger pill ---------- */
  .chat-trigger {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, 92vw);
    z-index: 20;
  }

  .chat-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-lg);
    padding: 6px 6px 6px 22px;
  }

  .chat-pill input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14.5px;
    color: var(--text);
    font-family: inherit;
    min-width: 0;
  }

  .chat-pill input::placeholder { color: #9CA3AF; }

  .round-send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .round-send-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .round-send-btn:active:not(:disabled) { transform: scale(0.94); }
  .round-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .round-send-btn .icon { width: 17px; height: 17px; }

  /* ---------- Bottom nav pills ---------- */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-lg);
    padding: 6px;
    max-width: 94vw;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .bottom-nav::-webkit-scrollbar { display: none; }

  .nav-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    padding: 9px 15px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .nav-pill .icon { width: 15px; height: 15px; }

  .nav-pill:hover { color: var(--text); background: var(--bg); }

  .nav-pill.active {
    background: var(--accent);
    color: #fff;
  }

  /* ---------- Chat overlay / modal ---------- */
  .chat-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 16, 35, 0.45);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .chat-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .chat-modal {
    width: min(540px, 100%);
    max-height: min(680px, 88vh);
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(14px) scale(0.97);
    transition: transform 0.2s ease;
  }

  .chat-overlay.open .chat-modal {
    transform: translateY(0) scale(1);
  }

  .chat-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .chat-modal-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-modal-title img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--accent-light);
  }

  .chat-modal-title strong {
    display: block;
    font-size: 14.5px;
    font-weight: 700;
  }

  .chat-modal-title span {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
  }

  .close-btn {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: var(--bg);
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .close-btn:hover { background: var(--accent-light); color: var(--accent-dark); }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    padding: 10px;
  }

  .msg-row {
    display: flex;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 82%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg-row.user .bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg-row.ai .bubble {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .ai-block { max-width: 82%; }

  .typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    opacity: 0.5;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .sources { margin-top: 8px; }

  .sources summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--accent-dark);
    font-weight: 600;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    user-select: none;
  }

  .sources summary::-webkit-details-marker { display: none; }

  .sources summary::before {
    content: "▸";
    font-size: 10px;
    transition: transform 0.15s ease;
  }

  .sources[open] summary::before { transform: rotate(90deg); }

  .source-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.5;
  }

  .chat-input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .chat-input-bar textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 12px;
    color: var(--text);
    max-height: 120px;
    line-height: 1.4;
  }

  .chat-input-bar textarea::placeholder { color: #9CA3AF; }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .topbar { padding: 16px 16px; }
    .resume-pill { padding: 9px 13px; font-size: 12.5px; }
    .icon-btn { width: 36px; height: 36px; }

    .social-rail { left: 12px; gap: 10px; }
    .social-rail::after { height: 40px; }
    .social-icon { width: 34px; height: 34px; }
    .social-icon svg { width: 15px; height: 15px; }

    .hero { padding: 120px 16px 210px; }
    .hero-avatar { width: 84px; height: 84px; }

    .chat-trigger { bottom: 92px; width: 94vw; }
    .bottom-nav { bottom: 16px; }
    .nav-pill { padding: 8px 12px; font-size: 12px; }

    .chat-modal {
      width: 100vw;
      max-height: 100vh;
      height: 100vh;
      border-radius: 0;
    }
  }

  @media (max-width: 380px) {
    .nav-pill span.nav-label { display: none; }
  }
</style>
</head>

    </button>
    <button type="button" class="nav-pill" data-section="projects">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label">Projects</span>
    </button>
    <button type="button" class="nav-pill" data-section="experience">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span class="nav-label">Experience</span>
    </button>
    <button type="button" class="nav-pill" data-section="skills">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="nav-label">Skills</span>
    </button>
    <button type="button" class="nav-pill" data-section="certifications">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
      <span class="nav-label">Certifications</span>
    </button>
  </nav>

  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-modal">
      <div class="chat-modal-header">
        <div class="chat-modal-title">
          <img src="/static/images/avatar.jpg" alt="" onerror="this.style.display='none'">
          <div>
            <strong>Ask Abdur</strong>
            <span>AI Engineer &amp; Full-Stack Developer</span>
          </div>
        </div>
        <button type="button" class="close-btn" id="closeChatBtn" aria-label="Close chat">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="chat-log" id="chatLog">
        <div class="empty-state" id="emptyState">Ask a question to get started...</div>
      </div>

      <form class="chat-input-bar" id="modalForm" autocomplete="off">
        <textarea id="modalInput" rows="1" placeholder="Ask a follow-up..." aria-label="Ask a follow-up question"></textarea>
        <button type="submit" class="round-send-btn" id="modalSendBtn" aria-label="Send">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </div>

<script>
  const chatOverlay = document.getElementById('chatOverlay');
  const chatLog = document.getElementById('chatLog');
  const emptyStateEl = document.getElementById('emptyState');

  const heroForm = document.getElementById('heroForm');
  const heroInput = document.getElementById('heroInput');

  const modalForm = document.getElementById('modalForm');
  const modalInput = document.getElementById('modalInput');
  const modalSendBtn = document.getElementById('modalSendBtn');
  const closeChatBtn = document.getElementById('closeChatBtn');

  let isSending = false;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openChat() {
    chatOverlay.classList.add('open');
  }

  function closeChat() {
    chatOverlay.classList.remove('open');
  }

  function scrollToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function addUserMessage(text) {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chatLog.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typingRow';
    row.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatLog.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function addAiMessage(answer, sources) {
    const row = document.createElement('div');
    row.className = 'msg-row ai';

    let sourcesHtml = '';
    if (sources && sources.length > 0) {
      const items = sources.map(s => `<div class="source-item">${escapeHtml(s)}</div>`).join('');
      sourcesHtml = `
        <details class="sources">
          <summary>Sources (${sources.length})</summary>
          ${items}
        </details>`;
    }

    row.innerHTML = `
      <div class="ai-block">
        <div class="bubble">${escapeHtml(answer)}</div>
        ${sourcesHtml}
      </div>`;
    chatLog.appendChild(row);
    scrollToBottom();
  }

  function addErrorMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.innerHTML = `<div class="bubble" style="color:#B91C1C; border-color:#FCA5A5; background:#FEF2F2;">${escapeHtml(text)}</div>`;
    chatLog.appendChild(row);
    scrollToBottom();
  }

  async function askQuestion(question) {
    if (!question || isSending) return;
    isSending = true;
    modalSendBtn.disabled = true;

    addUserMessage(question);
    addTypingIndicator();

    try {
      const response = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      if (!response.ok) throw new Error('Request failed');

      const data = await response.json();
      removeTypingIndicator();
      addAiMessage(data.answer, data.sources);
    } catch (err) {
      removeTypingIndicator();
      addErrorMessage('Sorry, something went wrong while getting a response. Please try again.');
    } finally {
      isSending = false;
      modalSendBtn.disabled = false;
    }
  }

  heroForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const question = heroInput.value.trim();
    if (!question) return;
    heroInput.value = '';
    openChat();
    askQuestion(question);
  });

  modalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const question = modalInput.value.trim();
    if (!question) return;
    modalInput.value = '';
    autoResizeModalInput();
    askQuestion(question);
  });

  modalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      modalForm.requestSubmit();
    }
  });

  function autoResizeModalInput() {
    modalInput.style.height = 'auto';
    modalInput.style.height = Math.min(modalInput.scrollHeight, 120) + 'px';
  }
  modalInput.addEventListener('input', autoResizeModalInput);

  closeChatBtn.addEventListener('click', closeChat);

  chatOverlay.addEventListener('click', (e) => {
    if (e.target === chatOverlay) closeChat();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && chatOverlay.classList.contains('open')) closeChat();
  });

  document.querySelectorAll('.nav-pill').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-pill').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>
</body>
</html>
